name: Build IPK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang flex bison g++ gawk gettext git \
            libncurses5-dev libssl-dev python3 python3-distutils rsync \
            unzip zlib1g-dev file wget

      - name: Download OpenWrt SDK
        run: |
          wget https://downloads.openwrt.org/releases/23.05.5/targets/ramips/mt7621/openwrt-sdk-23.05.5-ramips-mt7621_gcc-12.3.0_musl.Linux-x86_64.tar.xz
          tar -xf openwrt-sdk-23.05.5-ramips-mt7621_gcc-12.3.0_musl.Linux-x86_64.tar.xz
          mv openwrt-sdk-23.05.5-ramips-mt7621_gcc-12.3.0_musl.Linux-x86_64 openwrt-sdk

      - name: Update feeds
        run: |
          cd openwrt-sdk
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Copy package
        run: |
          mkdir -p openwrt-sdk/package/luci-app-quickmodify
          cp -r Makefile htdocs root openwrt-sdk/package/luci-app-quickmodify/

      - name: Prepare config
        run: |
          cd openwrt-sdk
          echo "CONFIG_PACKAGE_luci-app-quickmodify=m" >> .config
          make defconfig

      - name: Build package
        run: |
          cd openwrt-sdk
          make package/luci-app-quickmodify/compile V=s -j$(nproc)

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: luci-app-quickmodify_ipk_ramips_mt7621
          path: openwrt-sdk/bin/packages/*/base/luci-app-quickmodify*.ipk
